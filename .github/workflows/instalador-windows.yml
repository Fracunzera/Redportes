name: instaladores

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Última base de fabricantes guardada
        uses: actions/cache/restore@v4
        with:
          path: redportes/recursos/oui.csv
          key: oui-${{ github.run_id }}
          restore-keys: oui-

      - name: Base de fabricantes (IEEE) para incluir en el instalador
        continue-on-error: true
        timeout-minutes: 6
        shell: python
        run: |
          import sys, time
          sys.path.insert(0, ".")
          from pathlib import Path
          from redportes import oui
          oui.URL_WIRESHARK = ""  # solo la IEEE para redistribuir
          for intento in range(4):
              try:
                  print(oui.actualizar_base(Path("redportes/recursos/oui.csv")), "fabricantes")
                  break
              except Exception as e:
                  print("intento", intento + 1, "falló:", e)
                  time.sleep(20)

      - name: Guardar la base de fabricantes para próximos armados
        if: hashFiles('redportes/recursos/oui.csv') != ''
        uses: actions/cache/save@v4
        with:
          path: redportes/recursos/oui.csv
          key: oui-${{ github.run_id }}

      - name: Dependencias
        run: pip install . pyinstaller pytest

      - name: Tests
        run: pytest -q

      - name: Versión
        id: v
        shell: bash
        run: echo "version=$(python -c 'import redportes; print(redportes.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Ejecutable (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name Redportes
          --icon redportes/recursos/icono.ico
          --add-data "redportes/recursos;redportes/recursos"
          empaquetado/redportes_gui.py

      - name: Probar que el ejecutable arranca
        shell: pwsh
        run: |
          $p = Start-Process dist\Redportes\Redportes.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "El ejecutable se cerró solo (código $($p.ExitCode))" }
          Stop-Process -Id $p.Id

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=${{ steps.v.outputs.version }}" empaquetado\redportes.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló" }

      - name: Versión portable (zip)
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $dir = "dist\portable\Redportes-$v-portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item -Recurse dist\Redportes\* $dir
          Set-Content "$dir\portable.txt" "Redportes portable: el historial, la configuracion y los informes se guardan en esta carpeta (datos\ e Informes\). Abri Redportes.exe."
          Compress-Archive -Path $dir -DestinationPath "dist\Redportes-$v-portable.zip"
          # Probar que la portable arranca y guarda en su carpeta
          $p = Start-Process "$dir\Redportes.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "La portable se cerró sola" }
          Stop-Process -Id $p.Id
          if (-not (Test-Path "$dir\datos")) { throw "La portable no creó su carpeta de datos" }

      - uses: actions/upload-artifact@v4
        with:
          name: Redportes-instalador
          path: |
            dist/Redportes-*-instalador.exe
            dist/Redportes-*-portable.zip

      # Nombres fijos: así el botón «Descargar» del README apunta siempre a la última versión
      # (https://github.com/Fracunzera/Redportes/releases/latest/download/<nombre>).
      - name: Nombres fijos para la descarga directa
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\release | Out-Null
          Copy-Item (Get-Item dist\Redportes-*-instalador.exe) dist\release\Redportes-Windows-instalador.exe
          Copy-Item (Get-Item dist\Redportes-*-portable.zip) dist\release\Redportes-Windows-portable.zip

      - name: Notas de la versión (desde CHANGELOG.md)
        if: github.event_name == 'release'
        shell: python
        run: |
          import re
          v = "${{ steps.v.outputs.version }}"
          texto = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(v)}\][^\n]*\n(.*?)(?=^## \[|\Z)", texto, re.S | re.M)
          cuerpo = (m.group(1).strip() if m else "") + "\n\n**Descargas:** `Redportes-Windows-instalador.exe` (instalador), `Redportes-Windows-portable.zip` (sin instalar) o `Redportes-Linux-x86_64.AppImage` (Linux). Si Windows muestra «protegió su PC», tocá *Más información* → *Ejecutar de todas formas*."
          open("notas.md", "w", encoding="utf-8").write(cuerpo)

      - name: Publicar en Releases
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          body_path: notas.md
          append_body: true
          files: |
            dist/release/Redportes-Windows-instalador.exe
            dist/release/Redportes-Windows-portable.zip

  linux:
    runs-on: ubuntu-22.04   # glibc 2.35: el AppImage corre en Debian 12, Ubuntu 22.04+, Mint 21+, Fedora 36+
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paquetes del sistema
        run: sudo apt-get update && sudo apt-get install -y libtk8.6 xvfb file

      - name: Última base de fabricantes guardada
        uses: actions/cache/restore@v4
        with:
          path: redportes/recursos/oui.csv
          key: oui-linux-${{ github.run_id }}
          restore-keys: |
            oui-

      - name: Base de fabricantes (IEEE)
        continue-on-error: true
        timeout-minutes: 6
        shell: python
        run: |
          import sys, time
          sys.path.insert(0, ".")
          from pathlib import Path
          from redportes import oui
          oui.URL_WIRESHARK = ""
          for intento in range(4):
              try:
                  print(oui.actualizar_base(Path("redportes/recursos/oui.csv")), "fabricantes")
                  break
              except Exception as e:
                  print("intento", intento + 1, "falló:", e)
                  time.sleep(20)

      - name: Dependencias
        run: pip install . pyinstaller pytest

      - name: Tests
        run: pytest -q

      - name: Ejecutable (PyInstaller)
        run: >
          pyinstaller --noconfirm --name redportes
          --add-data "redportes/recursos:redportes/recursos"
          empaquetado/redportes_gui.py

      - name: AppImage
        run: |
          set -e
          APPDIR=AppDir
          mkdir -p $APPDIR/usr/lib
          cp -r dist/redportes $APPDIR/usr/lib/redportes
          cp redportes/recursos/icono.png $APPDIR/redportes.png
          cat > $APPDIR/redportes.desktop <<'DESK'
          [Desktop Entry]
          Type=Application
          Name=Redportes
          GenericName=Escáner de red
          Comment=Mapa de la red, qué es cada equipo, qué revisar e informes
          Exec=redportes
          Icon=redportes
          Terminal=false
          Categories=Network;System;Utility;
          StartupWMClass=Redportes
          DESK
          sed -i 's/^          //' $APPDIR/redportes.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/lib/redportes/redportes" "$@"\n' > $APPDIR/AppRun
          chmod +x $APPDIR/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p dist/release
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool $APPDIR dist/release/Redportes-Linux-x86_64.AppImage
          ls -la dist/release

      - name: Probar el AppImage (consola y ventana)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./dist/release/Redportes-Linux-x86_64.AppImage --version
          set +e
          timeout 12 xvfb-run -a ./dist/release/Redportes-Linux-x86_64.AppImage
          codigo=$?
          set -e
          if [ "$codigo" -ne 124 ]; then echo "La ventana se cerró sola (código $codigo)"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Redportes-Linux
          path: dist/release/Redportes-Linux-x86_64.AppImage

      - name: Publicar en Releases
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/Redportes-Linux-x86_64.AppImage
